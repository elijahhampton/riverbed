[workspace]
members = ["crates/riverbed", "crates/blackboard"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elijahhampton/riverbed"

[workspace.dependencies]
riverbed = { version = "0.1.0", path = "crates/riverbed" }

async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
